# Dependabot opens weekly pull requests to update dependencies and the pinned GitHub Actions.
# Each one goes through CI like any other change; the owner merges them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Minor and patch updates are batched. Each major update gets its own PR, so an
      # incompatible major fails CI on its own instead of breaking the whole batch.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node's type definitions follow the runtime major in .nvmrc (24). Raise this together
      # with .nvmrc and `engines` when the project moves to the next Node LTS.
      - dependency-name: '@types/node'
        versions: ['>=25']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
