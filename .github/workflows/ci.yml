# Continuous integration: runs on every pull request and on every push to main. The owner merges
# a PR only when all of these pass. `npm run ci:local` runs the same steps locally (AGENTS.md).
name: CI
on:
  push:
    branches: [main]
  pull_request:
# Least privilege: jobs can read the code and nothing else unless they ask for more.
permissions:
  contents: read
# Every job has `timeout-minutes`, so a hung step (e.g. a stalled browser download) fails in
# minutes instead of running for GitHub's 6-hour default.
jobs:
  # Lint, types, contrast, unit tests with coverage, build, and dependency checks.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to exact commits (the comment names the version), so a tampered tag
      # can't change what runs. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install exactly what package-lock.json lists.
      - run: npm ci
      # Fails on peer-dependency conflicts or orphaned packages in the lockfile.
      - run: npm ls --all > /dev/null
      # Fails on known high-severity vulnerabilities in dependencies.
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run verify
  # Browser tests (Playwright) against the production build, at three screen widths.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The security checks again, on Cloudflare's real runtime (wrangler pages dev), locally.
      - run: npm run e2e:cf
  # Storybook: builds it and checks every story with axe (ADR-0007, ADR-0010).
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:test
  # Scans the whole git history for committed secrets (API keys, tokens).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On pull requests the action lists the PR's commits, which needs read access to PRs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
