# The rate-limit Worker (ADR-0029, Stage 4 H4). Bound to the Pages project as RATE_LIMITER.
# No secrets belong in this file; it is committed.
name = "deep-cuts-rate-limit"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# No public URL: the Pages Function reaches this Worker only through its service binding.
workers_dev = false
preview_urls = false

# Cloudflare's built-in rate limiter (free on Workers Free). Counts are per key, per location, and
# kept only in memory. 120 requests per 60 s per client (owner, 2026-10-07): a heavy first Discover
# load needs about 80 (src/session/feedBudget.test.ts checks this), so 60 would cut it short.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# A tighter limit for sign-in, registration and account changes (ADR-0031): 10 per 60 s per client.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
