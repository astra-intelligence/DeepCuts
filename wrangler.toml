# Cloudflare Pages project config (ADR-0029, Stage 4 H3). Committed, so it must never hold a
# secret: TMDB_READ_TOKEN is an encrypted Pages secret in production and comes from `.dev.vars`
# (git-ignored) locally.
name = "deep-cuts"
pages_build_output_dir = "dist"
# Fixed so the runtime's behavior only changes when this date is moved on purpose.
compatibility_date = "2026-10-01"

# Plain settings (not secrets). CANONICAL_HOST is the only address the API answers on
# (server/apiGuard.ts): old deploys at <hash>.deep-cuts.pages.dev, and deep-cuts.pages.dev itself,
# get 421 from every /api/* route. Local runs on localhost are always allowed.
[vars]
CANONICAL_HOST = "deep-cuts.example"

# The rate-limit Worker (workers/rate-limit/), called by the Functions before any other work.
[[services]]
binding = "RATE_LIMITER"
service = "deep-cuts-rate-limit"

# The accounts database (ADR-0031, Stage 6): Cloudflare D1 (SQLite), Free plan. Schema changes are
# versioned SQL files in migrations/. Locally, `npm run db:migrate:local` creates it under
# .wrangler/ (git-ignored). The id below is the hosted database's, created with
# `wrangler d1 create deep-cuts` (docs repo: hosting/go-live-checklist.md). It is not a secret:
# using it needs the owner's Cloudflare login.
[[d1_databases]]
binding = "DB"
database_name = "deep-cuts"
database_id = "bffdf6b8-1516-4ccc-a641-5a8d2e6a829d"
migrations_dir = "migrations"
